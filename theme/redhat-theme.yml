extends: default
font:
  catalog:
    Red Hat Display:
      normal: RedHatDisplay-Regular.ttf
      bold: RedHatDisplay-Bold.ttf
      italic: RedHatDisplay-Italic.ttf
      bold_italic: RedHatDisplay-BoldItalic.ttf
    Red Hat Display Medium:
      normal: RedHatDisplay-Medium.ttf
      bold: RedHatDisplay-Bold.ttf
      italic: RedHatDisplay-Italic.ttf
      bold_italic: RedHatDisplay-BoldItalic.ttf
    Red Hat Text:
      normal: RedHatText-Regular.ttf
      bold: RedHatText-Bold.ttf
      italic: RedHatText-Italic.ttf
      bold_italic: RedHatText-BoldItalic.ttf
    Red Hat Text Medium:
      normal: RedHatText-Medium.ttf
      bold: RedHatText-Bold.ttf
      italic: RedHatText-Italic.ttf
      bold_italic: RedHatText-BoldItalic.ttf
    Red Hat Mono:
      normal: RedHatMono-Regular.ttf
      bold: RedHatMono-Bold.ttf
      italic: RedHatMono-Italic.ttf
      bold_italic: RedHatMono-BoldItalic.ttf
page:
  background_color: FFFFFF
  layout: portrait
  margin: [0.75in, 0.75in, 0.85in, 0.75in]
  size: A4
base:
  text_align: left
  font_color: 151515
  font_family: Red Hat Text
  font_size: 9.5
  line_height_length: 13
  line_height: $base_line_height_length / $base_font_size
  font_size_large: round($base_font_size * 1.15)
  font_size_small: round($base_font_size * 0.85)
  font_size_min: $base_font_size * 0.75
  border_color: D2D2D2
  border_radius: 2
  border_width: 0.5
role:
  subtitle:
    font_color: 6A6E73
    font_size: 0.85em
    font_style: normal
  red:
    font_color: EE0000
vertical_rhythm: $base_line_height_length
horizontal_rhythm: $base_line_height_length
link:
  font_color: 0066CC
codespan:
  font_color: 151515
  font_family: Red Hat Mono
  font_size: 0.85em
  background_color: F5F5F5
  border_color: D2D2D2
  border_radius: 2
  border_width: 0.5
  border_offset: 1.5
heading:
  text_align: left
  font_family: Red Hat Display
  font_color: 151515
  font_style: bold
  h1_font_size: floor($base_font_size * 2.4)
  h1_font_color: 151515
  h2_font_size: floor($base_font_size * 1.8)
  h2_font_color: 151515
  h3_font_size: round($base_font_size * 1.4)
  h3_font_color: 3C3F42
  h4_font_size: round($base_font_size * 1.15)
  h4_font_color: 3C3F42
  h5_font_size: $base_font_size
  h6_font_size: $base_font_size_small
  line_height: 1.2
  margin_top: $vertical_rhythm * 0.6
  margin_bottom: $vertical_rhythm * 0.6
  min_height_after: $base_line_height_length * 1.5
title_page:
  text_align: left
  logo:
    top: 5%
    align: left
    image: image:images/redhat-hat-icon-medium.png[pdfwidth=1.2in]
  title:
    top: 25%
    font_family: Red Hat Display
    font_size: 32
    font_style: bold
    font_color: 151515
    line_height: 1.1
  subtitle:
    font_family: Red Hat Display
    font_size: 18
    font_style: normal
    font_color: EE0000
    line_height: 1.2
    margin_top: 8
  authors:
    margin_top: $base_font_size * 2
    font_family: Red Hat Text
    font_size: $base_font_size
    font_color: 6A6E73
  revision:
    margin_top: $base_font_size * 0.5
    font_color: 6A6E73
block:
  margin_bottom: $vertical_rhythm * 0.8
caption:
  align: left
  font_size: $base_font_size * 0.9
  font_style: italic
  margin_inside: $vertical_rhythm / 3
  margin_outside: 0
admonition:
  column_rule_color: D2D2D2
  column_rule_width: 0.5
  padding: [6, 12, 6, 12]
  font_size: $base_font_size_small
  background_color: F5F5F5
  border_color: D2D2D2
  border_radius: 2
  border_width: 0.5
  label:
    text_transform: uppercase
    font_style: bold
    font_color: EE0000
code:
  font_color: 151515
  font_family: Red Hat Mono
  font_size: 8
  padding: [8, 10, 8, 10]
  line_height: 1.3
  background_color: F5F5F5
  border_color: D2D2D2
  border_radius: 2
  border_width: 0.5
table:
  background_color: FFFFFF
  border_color: D2D2D2
  border_width: 0.5
  grid_color: D2D2D2
  grid_width: 0.5
  cell_padding: [4, 6, 4, 6]
  head:
    font_style: bold
    font_color: 151515
    background_color: F0F0F0
    border_bottom_width: 1
  body:
    stripe_background_color: F9F9F9
description_list:
  term_font_style: bold
  term_font_family: Red Hat Text Medium
  term_spacing: $vertical_rhythm / 4
  description_indent: $horizontal_rhythm * 1.25
list:
  indent: $horizontal_rhythm * 1.5
  item_spacing: $vertical_rhythm / 3
sidebar:
  background_color: F5F5F5
  border_color: D2D2D2
  border_radius: 2
  border_width: 0.5
  padding: [10, 12, 10, 12]
thematic_break:
  border_color: EE0000
  border_style: solid
  border_width: 1
  padding: [$vertical_rhythm * 0.5, 0]
header:
  font_family: Red Hat Text
  font_size: 8
  font_color: 6A6E73
  line_height: 1
  height: $base_line_height_length * 3
  border_color: D2D2D2
  border_width: 0.5
  padding: [6, 1, 6, 1]
  vertical_align: middle
  image_vertical_align: middle
  recto:
    left:
      content: 'developers.redhat.com'
    center:
      content: ''
    right:
      content: 'redhat-developer    @rhdevelopers'
  verso:
    left:
      content: $header_recto_left_content
    right:
      content: $header_recto_right_content
footer:
  font_family: Red Hat Text
  font_size: 8
  font_color: 6A6E73
  border_color: D2D2D2
  border_width: 0.5
  height: $base_line_height_length * 3
  line_height: 1
  padding: [6, 1, 0, 1]
  vertical_align: top
  recto:
    left:
      content: ''
    center:
      content: '-- {page-number} of {page-count} --'
    right:
      content: ''
  verso:
    center:
      content: $footer_recto_center_content
